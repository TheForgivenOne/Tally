# tmux config

# Enable extended keys (CSI-u key handling, e.g. Ctrl+Shift+Letter,
# Shift+Enter, etc.). Requires tmux 3.2+.
# `on` forces the extended-key mode; use `always` if you want it
# even when the outer terminal doesn't advertise support.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
